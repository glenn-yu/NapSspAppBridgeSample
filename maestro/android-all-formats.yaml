appId: com.gwangy.nassspandroidsample
---
# Each format starts from a fresh app state so ad views/full-screen ads cannot cover the next button.

- launchApp:
    clearState: true
- assertVisible: "NapSsp Hybrid Sample"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Load Banner.*"
    direction: DOWN
    timeout: 10000
- tapOn: "Load Banner.*"
- scrollUntilVisible:
    element:
      text: ".*LOADAD SUCCESS.*Accepted banner.*"
    direction: DOWN
    timeout: 15000

- launchApp:
    clearState: true
- assertVisible: "NapSsp Hybrid Sample"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Load Native Ad"
    direction: DOWN
    timeout: 10000
- tapOn: "Load Native Ad"
- scrollUntilVisible:
    element:
      text: ".*LOADAD SUCCESS.*Accepted native.*"
    direction: DOWN
    timeout: 15000

- launchApp:
    clearState: true
- assertVisible: "NapSsp Hybrid Sample"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Load Outstream Video"
    direction: DOWN
    timeout: 10000
- tapOn: "Load Outstream Video"
- scrollUntilVisible:
    element:
      text: ".*LOADAD SUCCESS.*Accepted video.*"
    direction: DOWN
    timeout: 15000

# Reward video presents a full-screen AppLovin test ad, so verify the native ad UI.
- launchApp:
    clearState: true
- assertVisible: "NapSsp Hybrid Sample"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Show Reward Video"
    direction: DOWN
    timeout: 10000
- tapOn: "Show Reward Video"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-reward-video

# Interstitial video returns bridge ACK in this test config; SDK log reports the ad unit does not support interstitial presentation.
- launchApp:
    clearState: true
- assertVisible: "NapSsp Hybrid Sample"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Show Interstitial Video"
    direction: DOWN
    timeout: 10000
- tapOn: "Show Interstitial Video"
- scrollUntilVisible:
    element:
      text: ".*LOADAD SUCCESS.*Accepted interstitialVideo.*"
    direction: DOWN
    timeout: 15000

# Interstitial banner presents a full-screen WebView ad whose text is not exposed in the UI hierarchy; screenshot is kept as evidence.
- launchApp:
    clearState: true
- assertVisible: "NapSsp Hybrid Sample"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Show Interstitial Banner.*"
    direction: DOWN
    timeout: 10000
- tapOn: "Show Interstitial Banner.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-interstitial-banner
