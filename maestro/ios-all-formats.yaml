appId: com.nasmedia.NapSspIOSSample
---
# Each format starts from a fresh app state so ad views/full-screen ads cannot cover the next button.

- launchApp:
    clearState: true
- assertVisible: "NapSsp iOS Hybrid"
- tapOn: "Initialize SDK"
- scrollUntilVisible:
    element:
      text: "Load Banner.*"
    direction: DOWN
    timeout: 10000
- tapOn: "Load Banner.*"
- scrollUntilVisible:
    element:
      text: ".*LOADAD SUCCESS.*Accepted banner.*"
    direction: DOWN
    timeout: 15000

- launchApp:
